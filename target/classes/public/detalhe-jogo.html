<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Detalhes do Jogo - SaberUp</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a href="CRUD_jogos.html" class="navbar-brand"><i class="bi bi-arrow-left"></i> Voltar</a>
    <span class="navbar-text text-white fw-bold" id="tituloJogo"></span>
  </div>
</nav>

<div class="container my-5">

  <!-- Formulário de Questão -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><i class="bi bi-question-circle"></i> Adicionar Questão</h4>
    </div>
    <div class="card-body">
      <form id="formQuestao">
        <div class="mb-3">
          <label class="form-label">Enunciado da Questão</label>
          <textarea id="enunciado" class="form-control" rows="2" required></textarea>
        </div>
        <button type="submit" class="btn btn-success"><i class="bi bi-plus-circle"></i> Adicionar Questão</button>
      </form>
    </div>
  </div>

  <!-- Lista de Questões -->
  <div class="card shadow-sm">
    <div class="card-header bg-secondary text-white">
      <h4 class="mb-0"><i class="bi bi-list-task"></i> Questões</h4>
    </div>
    <div class="card-body" id="listaQuestoes"></div>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const idJogo = params.get("id");
const tituloJogo = document.getElementById("tituloJogo");
const listaQuestoes = document.getElementById("listaQuestoes");


fetch(`/jogos`)
  .then(r => r.json())
  .then(jogos => {
    const jogo = jogos.find(j => j.idJogo == idJogo);
    tituloJogo.textContent = jogo ? jogo.titulo : "Jogo não encontrado";
  });

// Adicionar questão
document.getElementById("formQuestao").addEventListener("submit", e => {
  e.preventDefault();
  const enunciado = document.getElementById("enunciado").value;
  fetch("/questao", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enunciado, id_jogo: idJogo })
  }).then(() => {
    document.getElementById("formQuestao").reset();
    listarQuestoes();
  });
});


function listarQuestoes() {
  fetch(`/questoes/${idJogo}`)
    .then(r => r.json())
    .then(questoes => {
      listaQuestoes.innerHTML = "";
      if (!questoes || questoes.length === 0) {
        listaQuestoes.innerHTML = `<p class="text-muted">Nenhuma questão cadastrada.</p>`;
        return;
      }

      questoes.forEach(q => {
        const div = document.createElement("div");
        div.className = "mb-4";

        let respostasExistentes = null;
        const listaRespostas = [];

        if (q.respostas && q.respostas.length > 0 && q.respostas[0]) {
          respostasExistentes = q.respostas[0];

          const opcoes = ['opcao1','opcao2','opcao3','opcao4','opcao5'];
          opcoes.forEach((op, index) => {
            const texto = respostasExistentes[op];
            if (texto && texto.trim() !== '') {
              const classe = (respostasExistentes.correta === index + 1) ? 'list-group-item-success' : '';
              listaRespostas.push(`<li class="list-group-item ${classe}">${texto}</li>`);
            }
          });
        }


        const formRespostas = `
          <form id="formRespostas-${q.id_questao}" class="mb-3" onsubmit="salvarOuAtualizarResposta(event, ${q.id_questao}, ${respostasExistentes ? respostasExistentes.id_resposta : 'null'})">
            <div class="row g-2 mb-2">
              <div class="col"><input type="text" name="opcao1" class="form-control" placeholder="Opção 1" required value="${respostasExistentes ? respostasExistentes.opcao1 : ''}"></div>
              <div class="col"><input type="text" name="opcao2" class="form-control" placeholder="Opção 2" required value="${respostasExistentes ? respostasExistentes.opcao2 : ''}"></div>
              <div class="col"><input type="text" name="opcao3" class="form-control" placeholder="Opção 3" required value="${respostasExistentes ? respostasExistentes.opcao3 : ''}"></div>
              <div class="col"><input type="text" name="opcao4" class="form-control" placeholder="Opção 4" required value="${respostasExistentes ? respostasExistentes.opcao4 : ''}"></div>
              <div class="col"><input type="text" name="opcao5" class="form-control" placeholder="Opção 5" required value="${respostasExistentes ? respostasExistentes.opcao5 : ''}"></div>
            </div>
            <div class="mb-2">
              <label class="form-label">Número da opção correta (1-5):</label>
              <input type="number" name="correta" class="form-control" min="1" max="5" required value="${respostasExistentes ? respostasExistentes.correta : ''}">
            </div>
            <button type="submit" class="btn btn-${respostasExistentes ? 'warning' : 'primary'}">
              ${respostasExistentes ? 'Atualizar Resposta' : 'Salvar Resposta'}
            </button>
          </form>
        `;

        div.innerHTML = `
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <h5><i class="bi bi-question"></i> ${q.enunciado}</h5>
                <div>
                  <button class="btn btn-sm btn-warning me-2" onclick="editarQuestao(${q.id_questao}, '${q.enunciado.replace(/'/g, "\\'")}')">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-danger" onclick="removerQuestao(${q.id_questao})">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>

              <ul class="list-group list-group-flush mb-3 mt-3">
                ${listaRespostas.join('')}
              </ul>

              ${formRespostas}
            </div>
          </div>
        `;
        listaQuestoes.appendChild(div);
      });
    });
}

function salvarOuAtualizarResposta(event, id_questao, id_resposta = null) {
  event.preventDefault();
  const form = event.target;

  const data = {
    id_questao,
    opcao1: form.opcao1.value,
    opcao2: form.opcao2.value,
    opcao3: form.opcao3.value,
    opcao4: form.opcao4.value,
    opcao5: form.opcao5.value,
    correta: parseInt(form.correta.value)
  };

  const metodo = id_resposta ? 'PUT' : 'POST';
  const url = id_resposta ? `/resposta/${id_resposta}` : '/resposta';

  fetch(url, {
    method: metodo,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  }).then(() => {
    listarQuestoes();
  }).catch(err => console.error("Erro ao salvar/atualizar resposta:", err));
}



function editarQuestao(id, atual){
  const novo = prompt("Editar questão:", atual);
  if(novo && novo.trim()!==""){
    fetch(`/questao/${id}`, {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({enunciado:novo})
    }).then(()=>listarQuestoes());
  }
}


function removerQuestao(id){
  if(confirm("Remover esta questão?")){
    fetch(`/questao/${id}`, {method:"DELETE"}).then(()=>listarQuestoes());
  }
}

listarQuestoes();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saber Up - Tópicos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container-fluid">
    <!-- Logo + Nome -->
    <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
      <img src="logo.png" alt="Logo SaberUp" width="40" height="40" class="me-2">
      SaberUp
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="menuNavbar">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html" id="link-inicio"><i class="bi bi-house-door-fill"></i> Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="materias.html" id="link-materias"><i class="bi bi-journal-bookmark-fill"></i> Matérias</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="usuario.html" id="link-usuario"><i class="bi bi-person-circle"></i> Usuário</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<script>
  // Ativa a classe 'active' de acordo com a página atual
  const currentPage = window.location.pathname.split("/").pop();
  if (currentPage === "index.html") document.getElementById("link-inicio").classList.add("active");
  if (currentPage === "materias.html") document.getElementById("link-materias").classList.add("active");
  if (currentPage === "usuario.html") document.getElementById("link-usuario").classList.add("active");
</script>


  <main class="container my-5 text-center">
  <h2 class="text-primary mb-4" id="tituloPagina"></h2>
  <div class="row g-4" id="listaTopicos"></div>
</main>

<script src="js/materias-topicos.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const ano = params.get('ano');
const materiaId = params.get('materia');

const tituloPagina = document.getElementById("tituloPagina");
const listaTopicos = document.getElementById("listaTopicos");

if (!ano || !materiaId || !materiasTopicos[ano] || !materiasTopicos[ano][materiaId]) {
  tituloPagina.textContent = "Matéria não encontrada";
} else {
  const materia = materiasTopicos[ano][materiaId];
  tituloPagina.textContent = materia.nome;

  materia.topicos.forEach(topico => {
    const col = document.createElement("div");
    col.className = "col-md-4";
    col.innerHTML = `
      <div class="card shadow h-100 p-4 hover-card position-relative">
        <div class="card-body text-center">
          <i class="bi bi-book display-4 text-primary"></i>
          <h5 class="mt-3">${topico}</h5>
          <a href="quizzes.html?topico=${encodeURIComponent(topico)}" class="stretched-link"></a>
        </div>
      </div>`;
    listaTopicos.appendChild(col);
  });
}
</script>


  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

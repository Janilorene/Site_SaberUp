<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaberUp - Quizzes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
        <img src="logo.png" alt="Logo SaberUp" width="40" height="40" class="me-2">SaberUp
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="materias.html">Matérias</a></li>
          <li class="nav-item"><a class="nav-link" href="usuario.html">Usuário</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5 text-center">
  <h2 class="text-primary mb-4" id="tituloTopico"></h2>
  <div class="row g-4" id="listaQuizzes"></div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const topico = params.get('topico');

document.getElementById("tituloTopico").textContent = topico || "Tópico não encontrado";

const listaQuizzes = document.getElementById("listaQuizzes");

fetch(`/jogos?topico=${encodeURIComponent(topico || '')}`)
  .then(res => res.json())
  .then(quizzes => {
    if (!quizzes || quizzes.length === 0) {
      listaQuizzes.innerHTML = "<p class='text-muted'>Nenhum quiz encontrado para este tópico.</p>";
      return;
    }

    quizzes.forEach(q => {
      const col = document.createElement("div");
      col.className = "col-md-4";
      col.innerHTML = `
        <div class="card shadow h-100 p-4 hover-card position-relative">
          <div class="card-body text-center">
            <i class="bi bi-question-circle display-4 text-primary"></i>
            <h5 class="mt-3">${q.titulo}</h5>
            <p>${q.serieJogo}º Ano - ${q.materia}</p>
            <a href="questoes.html?id=${q.idJogo}&topico=${encodeURIComponent(topico)}" class="stretched-link"></a>
          </div>
        </div>`;
      listaQuizzes.appendChild(col);
    });
  })
  .catch(err => {
    console.error("Erro ao carregar quizzes:", err);
    listaQuizzes.innerHTML = "<p class='text-danger'>Erro ao carregar quizzes.</p>";
  });
</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

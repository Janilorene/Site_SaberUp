<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Jogos - SaberUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">🎮 CRUD Jogos - SaberUp</a>
    </div>
  </nav>

  <div class="container my-5">
    <!-- Cadastro -->
    <div class="card shadow-sm mb-5">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Cadastrar Jogo</h4>
      </div>
      <div class="card-body">
        <form id="formJogo" class="row g-3">
          <div class="col-md-3">
            <label for="serie_jogo" class="form-label">Série</label>
            <select id="serie_jogo" class="form-select" required>
              <option value="1">1º Ano</option>
              <option value="2">2º Ano</option>
              <option value="3">3º Ano</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="materia" class="form-label">Matéria</label>
            <select id="materia" class="form-select" required></select>
          </div>

          <div class="col-md-3">
            <label for="topico" class="form-label">Tópico</label>
            <select id="topico" class="form-select" required></select>
          </div>

          <div class="col-md-3">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" id="titulo" class="form-control" placeholder="Ex: Quiz de Álgebra" required>
          </div>

          <div class="col-12 text-end">
            <button type="submit" class="btn btn-success mt-3">
              <i class="bi bi-save"></i> Cadastrar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Lista -->
    <div class="card shadow-sm">
      <div class="card-header bg-secondary text-white">
        <h4 class="mb-0"><i class="bi bi-list-ul"></i> Lista de Jogos</h4>
      </div>
      <div class="card-body">
        <div id="listaJogos" class="row g-4"></div>
      </div>
    </div>
  </div>

  <script>
    // Dados de séries, matérias e tópicos
    const materiasTopicos = {
      "1": {
        "Álgebra Básica": ["Expressões Algébricas", "Equações e Inequações"],
        "Geometria Plana": ["Triângulos", "Polígonos", "Círculo"]
      },
      "2": {
        "Funções": ["Função Afim", "Função Quadrática"],
        "Trigonometria": ["Seno e Cosseno", "Tangente"]
      },
      "3": {
        "Cálculo": ["Derivadas", "Integrais"],
        "Estatística": ["Probabilidade", "Distribuição Normal"]
      }
    };

    const serieSelect = document.getElementById("serie_jogo");
    const materiaSelect = document.getElementById("materia");
    const topicoSelect = document.getElementById("topico");
    const form = document.getElementById("formJogo");
    const lista = document.getElementById("listaJogos");

    function atualizarMaterias() {
      const serie = serieSelect.value;
      materiaSelect.innerHTML = "";
      topicoSelect.innerHTML = "";
      if (materiasTopicos[serie]) {
        Object.keys(materiasTopicos[serie]).forEach(materia => {
          const option = document.createElement("option");
          option.value = materia;
          option.textContent = materia;
          materiaSelect.appendChild(option);
        });
        atualizarTopicos();
      }
    }

    function atualizarTopicos() {
      const serie = serieSelect.value;
      const materia = materiaSelect.value;
      topicoSelect.innerHTML = "";
      if (materiasTopicos[serie] && materiasTopicos[serie][materia]) {
        materiasTopicos[serie][materia].forEach(topico => {
          const option = document.createElement("option");
          option.value = topico;
          option.textContent = topico;
          topicoSelect.appendChild(option);
        });
      }
    }

    serieSelect.addEventListener("change", atualizarMaterias);
    materiaSelect.addEventListener("change", atualizarTopicos);

    // Função para listar jogos
    function listarJogos() {
      fetch("/jogos")
        .then(r => r.json())
        .then(jogos => {
          lista.innerHTML = "";
          if (jogos.length === 0) {
            lista.innerHTML = `<p class="text-center text-muted">Nenhum jogo cadastrado ainda.</p>`;
            return;
          }

          jogos.forEach(j => {
            const col = document.createElement("div");
            col.className = "col-md-4";
            col.innerHTML = `
              <div class="card h-100 shadow-sm border-0">
                <div class="card-body text-center">
                  <i class="bi bi-controller text-primary display-5"></i>
                  <h5 class="mt-3">${j.titulo}</h5>
                  <p class="text-muted mb-1">${j.serieJogo}º Ano</p>
                  <p class="small">${j.materia} - ${j.topico}</p>
                </div>
                <div class="card-footer bg-light text-center d-flex justify-content-around">
                  <button class="btn btn-sm btn-info" onclick="detalharJogo(${j.idJogo})">
                    <i class="bi bi-code-slash"></i> Detalhar
                  </button>
                  <button class="btn btn-sm btn-warning" onclick="atualizarJogo(${j.idJogo})">
                    <i class="bi bi-pencil"></i> Atualizar
                  </button>
                  <button class="btn btn-sm btn-danger" onclick="removerJogo(${j.idJogo})">
                    <i class="bi bi-trash"></i> Remover
                  </button>
                </div>
              </div>
            `;
            lista.appendChild(col);
          });
        });
    }

    // Ao clicar em detalhar → mostra o pedaço de código (página de explicação)
    function detalharJogo(id) {
      window.location.href = `detalhe-jogo.html?id=${id}`;
    }

    function removerJogo(id) {
      if (confirm("Tem certeza que deseja remover este jogo?")) {
        fetch(`/jogo/${id}`, { method: "DELETE" }).then(() => listarJogos());
      }
    }

    function atualizarJogo(id) {
      const novoTitulo = prompt("Novo título:");
      const novaSerie = prompt("Nova série (1-3):");
      const novaMateria = prompt("Nova matéria:");
      const novoTopico = prompt("Novo tópico:");
      if (novoTitulo && novaSerie && novaMateria && novoTopico) {
        fetch(`/jogo/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            titulo: novoTitulo,
            serieJogo: novaSerie,
            materia: novaMateria,
            topico: novoTopico
          })
        }).then(() => listarJogos());
      }
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const data = {
        serieJogo: serieSelect.value,
        titulo: document.getElementById("titulo").value,
        materia: materiaSelect.value,
        topico: topicoSelect.value
      };
      fetch("/jogo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }).then(() => {
        form.reset();
        atualizarMaterias();
        listarJogos();
      });
    });

    atualizarMaterias();
    listarJogos();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

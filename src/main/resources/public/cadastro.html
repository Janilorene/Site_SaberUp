<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saber Up - Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .card {
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn {
      width: 100%;
    }
    .form-label {
      font-weight: 500;
    }
    .link {
      color: var(--primary-color);
      text-decoration: none;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand text-white" href="index.html">Saber Up</a>
    </div>
  </nav>

  <!-- Conteúdo -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <h3 class="text-center text-primary mb-4">Crie sua conta</h3>

          <form action="/usuario" method="POST">
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="exemplo@email.com" required>
            </div>

            <div class="mb-3">
              <label for="nickname" class="form-label">Nickname</label>
              <input type="text" id="nickname" name="nickname" class="form-control" placeholder="Seu apelido" required>
            </div>

            <div class="mb-3">
              <label for="serie_usuario" class="form-label">Série</label>
              <select id="serie_usuario" name="serie_usuario" class="form-select" required>
                <option value="">Selecione sua série</option>
                <option value="1º Ano">1º Ano</option>
                <option value="2º Ano">2º Ano</option>
                <option value="3º Ano">3º Ano</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" id="senha" name="senha" class="form-control" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary mt-3">Cadastrar</button>
          </form>

          <p class="text-center mt-3">
            Já tem uma conta? <a href="login.html" class="link">Entrar</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
